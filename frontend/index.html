<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | MAPS Connect</title>
    <script>try{if(localStorage.getItem('tema-maps')==='oscuro'){document.documentElement.classList.add('dark-mode')}}catch(e){}</script>
    <script src="js/estilos.js?v=21"></script>
    <link rel="stylesheet" href="css/base.css?v=8">
    <link rel="stylesheet" href="css/layout.css?v=5">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/colores.css?v=1">
    <link rel="stylesheet" href="css/estilos.css?v=26">
</head>
<body class="login-page">
    <div class="auth-layout">
        <div class="auth-card card">
            <h1 class="page-title">Iniciar sesión</h1>
            <div id="alert-container"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Entrar</button>
            </form>
            <p class="form-hint" style="margin-top:1rem;text-align:center">
                Acceso exclusivo para la comunidad Tecmilenio
            </p>
            <p style="margin-top:0.5rem;text-align:center">
                <a href="registro.html">Crear cuenta</a>
            </p>
            <p style="margin-top:0.75rem;text-align:center;font-size:0.8rem;">
                <a id="link-aviso-login" role="button">Aviso de Privacidad</a>
            </p>
        </div>
    </div>
    <script src="js/api.js?v=5"></script>
    <script src="js/auth.js?v=7"></script>
    <script src="js/utils.js?v=5"></script>
    <script src="js/tema.js?v=2"></script>
    <script src="js/colores.js?v=1"></script>
    <script src="js/aviso-privacidad.js?v=1"></script>
    <script src="js/pages/login.js?v=8"></script>
</body>
</html>
