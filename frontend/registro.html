<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#087527">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Registro | MAPS Connect</title>
    <script>try{if(localStorage.getItem('tema-maps')==='oscuro'){document.documentElement.classList.add('dark-mode')}}catch(e){}</script>
    <script src="js/estilos.js?v=27"></script>
    <link rel="stylesheet" href="css/base.css?v=9">
    <link rel="stylesheet" href="css/layout.css?v=5">
    <link rel="stylesheet" href="css/components.css?v=8">
    <link rel="stylesheet" href="css/colores.css?v=1">
    <link rel="stylesheet" href="css/estilos.css?v=26">
    <style>
        .rol-selector {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .rol-selector label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 2rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--border-radius);
            cursor: pointer;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 0;
            transition: all 0.2s ease;
            min-width: 220px;
        }
        .rol-selector label input {
            margin-right: 0.4rem;
        }
        .rol-selector label.rol-activo {
            border-color: var(--primary-color);
            background: #eff6ff;
            font-weight: 600;
        }
        html.dark-mode .rol-selector label.rol-activo {
            background: rgba(8, 117, 39, 0.2);
            border-color: var(--primary-color);
            color: var(--text-color, #e2e8f0);
        }
    </style>
</head>
<body class="register-page">
<div class="auth-layout">
    <div class="auth-card card">
        <h1 class="page-title">Registro</h1>
        <div id="alert-container"></div>
        <form id="registro-form">
            <div class="form-group" style="text-align: center;">
                <label style="text-align: center; display: block; margin-bottom: 0.5rem; font-weight: 500;">Tipo de cuenta</label>
                <div class="rol-selector" id="rol-selector">
                    <label id="rol-card-estudiante" class="rol-activo">
                        <input type="radio" name="rol" value="estudiante" checked>
                        Estudiante
                    </label>
                </div>
            </div>
            <div class="form-group" id="group-identificador">
                <label for="matricula" id="label-identificador">Matrícula</label>
                <input type="text" id="matricula" class="form-control" required placeholder="ej. AL01234567">
                <div class="form-hint" id="hint-identificador">Matrícula de estudiante Tecmilenio</div>
            </div>
            <div class="form-group">
                <label for="nombre">Nombre(s)</label>
                <input type="text" id="nombre" class="form-control" required placeholder="Tu nombre">
            </div>
            <div class="form-group">
                <label for="apellido">Apellido(s)</label>
                <input type="text" id="apellido" class="form-control" required placeholder="Tus apellidos">
            </div>
            <div class="form-group">
                <label for="email">Correo institucional</label>
                <input type="email" id="email" class="form-control" required placeholder="tu_correo@tecmilenio.mx" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false">
                <div class="form-hint">Usa tu correo @tecmilenio.mx o @servicios.tecmilenio.mx</div>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" class="form-control" required minlength="8" placeholder="••••••••">
                <div class="form-hint">Mínimo 8 caracteres (al menos una mayúscula, una minúscula y un número)</div>
            </div>
            <div class="form-group">
                <label for="confirmar-contrasena">Confirmar contraseña</label>
                <input type="password" id="confirmar-contrasena" class="form-control" required minlength="8" placeholder="••••••••">
            </div>
            <div class="form-group">
                <div class="terminos-checkbox">
                    <input type="checkbox" id="acepta-terminos" required>
                    <label for="acepta-terminos">
                        He leído y acepto el
                        <a id="link-aviso-registro" role="button">Aviso de Privacidad</a>
                        y los
                        <a id="link-terminos-registro" role="button">Términos y Condiciones</a>.
                    </label>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Crear cuenta</button>
        </form>
        <p style="margin-top:1rem;text-align:center">
            <a href="login.html">Ya tengo cuenta</a>
        </p>
    </div>
</div>
<script src="js/api.js?v=9"></script>
<script src="js/auth.js?v=9"></script>
<script src="js/utils.js?v=9"></script>
<script src="js/tema.js?v=2"></script>
<script src="js/colores.js?v=1"></script>
<script src="js/aviso-privacidad.js?v=1"></script>
<script src="js/pages/registro.js?v=9"></script>
</body>
</html>
