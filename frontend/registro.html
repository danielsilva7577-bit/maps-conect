<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | MAPS Connect</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="register-page">
<div class="auth-layout">
    <div class="auth-card card">
        <h1 class="page-title">Registro</h1>
        <div id="alert-container"></div>
        <form id="registro-form">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">Correo institucional</label>
                <input type="email" id="email" class="form-control" required placeholder="usuario@tecmilenio.mx">
                <div class="form-hint">Debe ser un correo @tecmilenio.mx o @servicios.tecmilenio.mx</div>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" class="form-control" required minlength="6">
                <div class="form-hint">Mínimo 6 caracteres</div>
            </div>
            <div class="form-group">
                <label for="confirmar-contrasena">Confirmar contraseña</label>
                <input type="password" id="confirmar-contrasena" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Crear cuenta</button>
        </form>
        <p style="margin-top:1rem;text-align:center">
            <a href="login.html">Ya tengo cuenta</a>
        </p>
    </div>
</div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script src="js/pages/registro.js"></script>
</body>
</html>
