<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensajes | MAPS Connect</title>
    <script>try{if(localStorage.getItem('tema-maps')==='oscuro'){document.documentElement.classList.add('dark-mode')}}catch(e){}</script>
    <script src="../js/estilos.js?v=17"></script>
    <link rel="stylesheet" href="../css/base.css?v=8">
    <link rel="stylesheet" href="../css/layout.css?v=5">
    <link rel="stylesheet" href="../css/components.css?v=8">
    <link rel="stylesheet" href="../css/colores.css?v=1">
    <link rel="stylesheet" href="../css/mensajes.css?v=6">
    <link rel="stylesheet" href="../css/estilos.css?v=26">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="main-content" id="main-content">

                <section class="messages-container">

                    <!-- 1. BANDEJA LATERAL IZQUIERDA -->
                    <aside class="chat-sidebar">
                        <div class="chat-search-box">
                            <input type="text" id="chat-search" placeholder="Buscar compañero o profesor...">
                        </div>
                        <div class="conversation-list" id="conversacion-list">
                            <!-- Las conversaciones se renderizan aquí solo cuando el backend responde -->
                        </div>
                    </aside>

                    <!-- 2. VENTANA DE CHAT DERECHA -->
                    <section class="chat-window">

                        <header class="chat-header" id="chat-header">
                            <!-- Cabecera del chat: se renderiza al seleccionar una conversación -->
                        </header>

                        <div class="chat-body" id="chat-body">
                            <div class="chat-empty" id="chat-empty">Selecciona una conversación para ver los mensajes.</div>
                            <!-- Los mensajes se renderizan aquí solo cuando el backend responde -->
                        </div>

<footer class="chat-input-bar">
<div class="adjunto-area">
<input type="file" id="adjunto-input" hidden>
<button class="btn-clean" type="button" id="btn-adjuntar" title="Adjuntar archivo">Adjuntar</button>
<div id="adjunto-pendiente" class="adjunto-pendiente" hidden>
<span id="adjunto-pendiente-nombre"></span>
<button type="button" class="adjunto-quitar" id="adjunto-quitar" title="Quitar archivo">x</button>
</div>
</div>
<input type="text" id="mensaje-input" placeholder="Escribe un mensaje..." disabled>
<button class="btn-solid" type="button" id="enviar-mensaje" disabled>Enviar</button>
</footer>

                    </section>

                </section>

            </main>
        </div>
    </div>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=7"></script>
    <script src="../js/utils.js?v=5"></script>
    <script src="../js/tema.js?v=2"></script>
    <script src="../js/colores.js?v=1"></script>
    <script src="../js/aviso-privacidad.js?v=1"></script>
    <script src="../js/layout.js?v=12"></script>
    <script src="../js/pages/mensajes.js?v=5"></script>
</body>
</html>
