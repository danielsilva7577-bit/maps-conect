<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | MAPS Connect</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="main-content" id="main-content">

                <section class="perfil-container" id="perfil-root">

                    <!-- 1. CABECERA DE PERFIL -->
                    <div class="card profile-header-card">
                        <div class="profile-main-info" id="profile-header-info">
                            <!-- Avatar, nombre y datos se renderizan desde el backend (o sesión) -->
                        </div>
                        <div>
                            <button class="btn-clean" type="button" id="btn-editar-proposito">Editar Propósito</button>
                        </div>
                    </div>

                    <!-- 2. LAYOUT A DOS COLUMNAS -->
                    <div class="profile-grid">

                        <!-- COLUMNA IZQUIERDA: TRAYECTORIA ACADÉMICA MAPS -->
                        <section class="card">
                            <h3 class="section-heading">Identidad y Ruta MAPS</h3>

                            <div class="purpose-box" id="profile-purpose" hidden>
                                <strong>Propósito de Vida</strong>
                                <p id="profile-purpose-text"></p>
                            </div>

                            <h4 class="sub-heading">Certificados del Plan de Estudios</h4>
                            <div id="profile-certificados">
                                <!-- Los certificados se renderizan aquí solo cuando el backend responde -->
                            </div>
                        </section>

                        <!-- COLUMNA DERECHA: REPUTACIÓN Y ACTIVIDAD COMUNITARIA -->
                        <aside class="card">
                            <h3 class="section-heading">Aportaciones en la Comunidad</h3>

                            <div class="stats-summary" id="profile-stats">
                                <!-- Las estadísticas se renderizan aquí solo cuando el backend responde -->
                            </div>

                            <h4 class="sub-heading">Actividad Reciente</h4>
                            <ul class="activity-list" id="profile-actividad">
                                <!-- La actividad se renderiza aquí solo cuando el backend responde -->
                            </ul>
                        </aside>

                    </div>

                </section>

            </main>
        </div>
    </div>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/perfil.js"></script>
</body>
</html>
