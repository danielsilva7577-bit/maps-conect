<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | MAPS Connect</title>
    <script>try{if(localStorage.getItem('tema-maps')==='oscuro'){document.documentElement.classList.add('dark-mode')}}catch(e){}</script>
    <script src="../js/estilos.js?v=21"></script>
    <link rel="stylesheet" href="../css/base.css?v=8">
    <link rel="stylesheet" href="../css/layout.css?v=5">
    <link rel="stylesheet" href="../css/components.css?v=8">
    <link rel="stylesheet" href="../css/colores.css?v=1">
    <link rel="stylesheet" href="../css/perfil.css?v=6">
    <link rel="stylesheet" href="../css/estilos.css?v=26">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="main-content" id="main-content">

                <section class="perfil-container" id="perfil-root">

                    <!-- 1. CABECERA DE PERFIL -->
                    <div class="card profile-header-card">
                        <div class="profile-main-info" id="profile-header-info">
                            <!-- Avatar, nombre y datos se renderizan desde el backend (o sesión) -->
                        </div>
                        <div class="profile-header-actions">
                            <button class="btn-clean" type="button" id="btn-cambiar-foto">Cambiar Foto</button>
                            <button class="btn-clean" type="button" id="btn-cambiar-semestre">Cambiar Semestre</button>
                            <button class="btn-clean" type="button" id="btn-editar-proposito">Editar Propósito</button>
                            <input type="file" id="foto-input" accept="image/png,image/jpeg,image/webp" hidden>
                        </div>
                    </div>

                    <!-- 2. LAYOUT A DOS COLUMNAS -->
                    <div class="profile-grid">

                        <!-- COLUMNA IZQUIERDA: TRAYECTORIA ACADÉMICA MAPS -->
                        <section class="card">
                            <h3 class="section-heading">Identidad y Ruta MAPS</h3>

                            <div class="purpose-box" id="profile-purpose" hidden>
                                <strong>Propósito de Vida</strong>
                                <p id="profile-purpose-text"></p>
                            </div>

                            <h4 class="sub-heading">Certificados del Plan de Estudios</h4>
                            <div id="profile-certificados">
                                <!-- Los certificados se renderizan aquí solo cuando el backend responde -->
                            </div>
                        </section>

                        <!-- COLUMNA DERECHA: REPUTACIÓN Y ACTIVIDAD COMUNITARIA -->
                        <aside class="card">
                            <h3 class="section-heading">Aportaciones en la Comunidad</h3>

                            <div class="stats-summary" id="profile-stats">
                                <!-- Las estadísticas se renderizan aquí solo cuando el backend responde -->
                            </div>

                            <h4 class="sub-heading">Actividad Reciente</h4>
                            <ul class="activity-list" id="profile-actividad">
                                <!-- La actividad se renderiza aquí solo cuando el backend responde -->
                            </ul>
                        </aside>

                    </div>

                    <!-- 3. MI RED: SEGUIDORES Y DESCUBRIR PERSONAS -->
                    <section class="card" id="profile-red" hidden>
                        <h3 class="section-heading">Mi Red</h3>
                        <div class="red-stats" id="red-stats"></div>
                        <h4 class="sub-heading">Descubrir personas</h4>
                        <div class="discover-grid" id="discover-list">
                            <p class="discover-empty">Cargando personas...</p>
                        </div>
                    </section>

                </section>

            </main>
        </div>
    </div>
    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=7"></script>
    <script src="../js/utils.js?v=5"></script>
    <script src="../js/tema.js?v=2"></script>
    <script src="../js/colores.js?v=1"></script>
    <script src="../js/aviso-privacidad.js?v=1"></script>
    <script src="../js/layout.js?v=13"></script>
    <script src="../js/pages/perfil.js?v=7"></script>
</body>
</html>
