<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | MAPS Connect</title>
    <script>try{if(localStorage.getItem('tema-maps')==='oscuro'){document.documentElement.classList.add('dark-mode')}}catch(e){}</script>
    <script src="../js/estilos.js?v=21"></script>
    <link rel="stylesheet" href="../css/base.css?v=8">
    <link rel="stylesheet" href="../css/layout.css?v=5">
    <link rel="stylesheet" href="../css/components.css?v=8">
    <link rel="stylesheet" href="../css/colores.css?v=1">
    <link rel="stylesheet" href="../css/usuario.css?v=6">
    <link rel="stylesheet" href="../css/estilos.css?v=26">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main-wrapper">
            <header class="topbar" id="topbar"></header>
            <main class="main-content" id="main-content">

                <div class="perfil-container" id="usuario-root">

                    <!-- CABECERA DE PERFIL PÚBLICO -->
                    <div class="card profile-header-card">
                        <div class="profile-main-info">
                            <div class="profile-avatar trigger" id="avatarTrigger" title="Clic para ampliar imagen"></div>
                            <div>
                                <h2 class="profile-name" id="usuario-nombre"></h2>
                                <p class="profile-sub" id="usuario-sub"></p>
                                <p class="profile-sub" id="usuario-sub2"></p>
                            </div>
                        </div>

                        <!-- Acciones de interacción directa -->
                        <div class="header-actions" id="usuario-actions"></div>
                    </div>

                    <!-- LAYOUT PRINCIPAL -->
                    <div class="profile-grid">

                        <!-- COLUMNA IZQUIERDA: RUTA / PERFIL DOCENTE -->
                        <section class="card" id="col-izquierda"></section>

                        <!-- COLUMNA DERECHA: REPUTACIÓN Y APORTES -->
                        <aside class="card">
                            <h3 class="section-heading">Reputación en la Comunidad</h3>
                            <div class="stats-summary" id="usuario-stats"></div>

                            <h4 class="subsection-heading">Aportaciones Recientes</h4>
                            <div id="usuario-aportes"></div>
                        </aside>

                    </div>

                </main>

            </main>
        </div>
    </div>

    <!-- Modal para visualización ampliada del avatar -->
    <div class="avatar-modal-backdrop" id="avatarModal">
        <div class="avatar-modal-content">
            <button class="btn-close-modal" id="closeModalBtn" type="button" aria-label="Cerrar">Cerrar X</button>
            <div class="avatar-expanded-box" id="avatarExpanded"></div>
        </div>
    </div>

    <script src="../js/api.js?v=5"></script>
    <script src="../js/auth.js?v=7"></script>
    <script src="../js/utils.js?v=5"></script>
    <script src="../js/tema.js?v=2"></script>
    <script src="../js/colores.js?v=1"></script>
    <script src="../js/aviso-privacidad.js?v=1"></script>
    <script src="../js/layout.js?v=13"></script>
    <script src="../js/pages/usuario.js?v=5"></script>
</body>
</html>
